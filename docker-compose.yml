name: beb-raid

services:
  beb-raid:
    build: .
    container_name: beb-raid
    env_file: .env
    mem_limit: 512m
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  beb-absence:
    build: .
    container_name: beb-absence
    profiles:
      - absence
    env_file: .env
    environment:
      BOT_NAME: ${ABSENCE_BOT_NAME:-Dofus Absence Bot}
      BOT_COGS: absence
      DISCORD_TOKEN: ${ABSENCE_DISCORD_TOKEN:-}
    mem_limit: 512m
    volumes:
      - ./data:/app/data
    restart: unless-stopped
